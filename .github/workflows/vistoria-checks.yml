name: Vistoria checks
on:
  push:
    branches: [feat/equipe-compartilhada]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: find . -type f \\( -name '*.js' -o -name '*.mjs' \\) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Tests
        run: node --test
